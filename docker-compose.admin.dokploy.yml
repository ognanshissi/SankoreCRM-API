# Déploiement Dokploy du registre de tenants (Sankore.Admin), à partir des images publiées sur
# GHCR par .github/workflows/docker.yml — rien n'est construit sur le serveur. Même principe que
# docker-compose.dokploy.yml pour la pile API : chaque service ÉTEND son homologue de
# docker-compose.admin.yml, qui garde seul la liste des variables, et ce fichier ne dit que ce qui
# change en production — l'image tirée de GHCR à la place du `build:`, que `!reset` retire
# (Dokploy lance `up --build`, qui reconstruirait tout service portant un `build:`).
#
# Dans Dokploy (service Compose du registre) : Compose Path = ./docker-compose.admin.dokploy.yml,
# Autodeploy désactivé — la CI redéploie par le webhook du secret DOKPLOY_REGISTRY_WEBHOOK, une
# fois les images poussées. Mêmes variables d'environnement que pour docker-compose.admin.yml.
# Le serveur doit être connecté à ghcr.io avec un jeton `read:packages` (comme pour la pile API).
#
# Ordre : cette pile AVANT celle de l'API — elle crée le réseau `sankore-shared`.

name: "sankore-admin"
services:
  admin-postgres:
    extends:
      file: docker-compose.admin.yml
      service: admin-postgres
    # L'image Postgres de la pile API (pgvector + PostGIS), construite par la même CI depuis
    # postgres.Dockerfile — celui que docker-compose.admin.yml construisait.
    image: ghcr.io/ognanshissi/sankore-postgres:${POSTGRES_TAG:-latest}
    build: !reset null
    # `missing` : ne pas redémarrer la base du registre à chaque livraison applicative. Mettre à
    # jour Postgres reste un geste délibéré (`docker compose pull admin-postgres`, ou POSTGRES_TAG).
    pull_policy: missing

  sankore-admin:
    extends:
      file: docker-compose.admin.yml
      service: sankore-admin
    image: ghcr.io/ognanshissi/sankore-registry:${REGISTRY_TAG:-latest}
    build: !reset null
    # Sans ceci, `up` réutilise l'image `latest` déjà présente et un redéploiement ne change rien.
    pull_policy: always

# `extends` ne reprend que les services : réseaux et volumes redéclarés À L'IDENTIQUE de
# docker-compose.admin.yml. Un nom de volume différent ici monterait un registre VIDE.
networks:
  dokploy-network:
    external: true
  sankore-admin-internal:
    driver: "bridge"
  sankore-shared:
    name: "sankore-shared"
    driver: "bridge"

volumes:
  admin-postgres-data:
    driver: "local"
    name: "${ADMIN_POSTGRES_VOLUME:-sankore-admin-postgres-data}"
