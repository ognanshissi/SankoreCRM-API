services:
  sankore.api:
    image: sankore.api
    build:
      context: .
      dockerfile: src/Bootstrapper/Sankore.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sankore_crm;Username=sankore_app;Password=devpassword"
      Jwt__Issuer: "https://auth.sankore-crm.local"
      Jwt__Audience: "sankore-crm-api"
      Jwt__SigningKey: "dev-signing-key-change-in-production-must-be-long-enough"
      Messaging__UseRabbitMq: "true"
      Messaging__RabbitMqHost: "rabbitmq"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sankore_crm
      POSTGRES_USER: sankore_app
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sankore_app -d sankore_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:



