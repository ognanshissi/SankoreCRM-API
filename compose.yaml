services:
  sankore.api:
    image: ${DOCKER_REGISTRY-}sankore.api
    container_name: sankore.api
    build:
      context: .
      dockerfile: src/Bootstrapper/Sankore.Api/Dockerfile
    ports:
      - 5180:8080
      - 5181:8081
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=sankore.database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PW}"
      Jwt__Issuer: "https://auth.sankore-crm.local"
      Jwt__Audience: "sankore-crm-api"
      Jwt__SigningKey: "dev-signing-key-change-in-production-must-be-long-enough"
      Messaging__UseRabbitMq: "true"
      Messaging__RabbitMqHost: sankore.rabbitmq
    depends_on:
      sankore.database:
        condition: service_healthy
      sankore.rabbitmq:
        condition: service_healthy
    restart: always
    networks:
      - "default"

  sankore.database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PW}
    ports:
      - "5432:5432"
    volumes:
      - ./.containers/sankore-database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - "default"

  sankore.rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - ./.containers/sankore-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - "default"

networks:
  default:
    driver: bridge


