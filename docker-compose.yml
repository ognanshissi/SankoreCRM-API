services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    # Les ports des OUTILS sont liés à `TOOLS_BIND_ADDRESS`, par défaut la boucle locale.
    # `"18030:3000"` lie toutes les interfaces : sur un portable en réseau d'entreprise ou en
    # Wi-Fi public, ces tableaux de bord étaient joignables par n'importe qui sur le même
    # réseau. Les hôtes applicatifs restent sur toutes les interfaces, eux : ils exigent un
    # jeton, et on peut vouloir les appeler depuis un téléphone de test.
    ports:
      - "${TOOLS_BIND_ADDRESS}:${ASPIRE_DASHBOARD_PUBLISHED_PORT}:18888"
    expose:
      # 18888 ajoute : c'est le port que le routeur Traefik ci-dessous vise.
      - "18888"
      - "18889"
      - "18890"
    networks:
      - "sankore-internal"
      - "dokploy-network"
    # ── Exposition publique par Traefik (Dokploy) ──────────────────────────
    # 18888 est l'interface du tableau de bord. 18889 (OTLP/gRPC) et 18890 restent internes :
    # c'est par là que l'API, l'admin et Hangfire poussent leur télémétrie.
    #
    # Le tableau de bord Aspire exige en plus un jeton de navigateur, écrit dans ses
    # journaux au démarrage : `docker compose logs env-dashboard | grep -i token`.
    labels:
      traefik.enable: "true"
      # Le conteneur est sur DEUX réseaux depuis l'ajout ci-dessus. Sans cette ligne Traefik
      # choisit lui-même l'IP vers laquelle router, et il peut choisir celle de
      # `sankore-internal`, où il n'est pas rattaché : le domaine répond alors par
      # intermittence, ou pas du tout.
      traefik.docker.network: "dokploy-network"

      # Routeur HTTPS. `tls.certresolver=letsencrypt` est le résolveur que Dokploy déclare
      # dans son Traefik ; le certificat est demandé au premier appel du domaine, donc
      # l'enregistrement DNS doit déjà pointer sur l'hôte Dokploy AVANT le déploiement.
      traefik.http.routers.sankore-aspire.rule: "Host(`${TOOLS_DOMAIN_ASPIRE:-aspire.localhost}`)"
      traefik.http.routers.sankore-aspire.entrypoints: "websecure"
      traefik.http.routers.sankore-aspire.tls.certresolver: "letsencrypt"
      traefik.http.routers.sankore-aspire.middlewares: "sankore-auth-aspire"
      # `service` explicite : plusieurs ports sont déclarés sur ce conteneur et Traefik
      # refuse de deviner lequel servir.
      traefik.http.routers.sankore-aspire.service: "sankore-aspire"
      traefik.http.services.sankore-aspire.loadbalancer.server.port: "18888"

      # Authentification HTTP posée DEVANT l'application. Le middleware est défini ici, sur
      # le service qu'il protège, et non une fois pour toutes ailleurs : un middleware
      # déclaré sur un autre conteneur disparaît quand ce conteneur s'arrête, et tous les
      # routeurs qui le référencent tombent avec lui.
      #
      # `TOOLS_BASICAUTH_USERS` vide = middleware invalide = routeur refusé par Traefik. Le
      # domaine ne répond pas tant que les identifiants ne sont pas posés, ce qui est le bon
      # sens de l'échec : jamais d'ouverture par oubli.
      traefik.http.middlewares.sankore-auth-aspire.basicauth.users: "${TOOLS_BASICAUTH_USERS}"
      # L'en-tête `Authorization` n'est pas transmis en amont : l'application derrière n'a
      # rien à faire de ces identifiants-là, et Grafana comme Hangfire ont les leurs.
      traefik.http.middlewares.sankore-auth-aspire.basicauth.removeheader: "true"

      # Routeur HTTP, uniquement pour renvoyer sur HTTPS. La redirection est définie ici
      # plutôt qu'emprunté au `redirect-to-https` de Dokploy : celui-là vit dans le
      # fournisseur `file` de Traefik et devrait être référencé `redirect-to-https@file`,
      # un détail qui casse en silence si Dokploy le renomme.
      traefik.http.routers.sankore-aspire-web.rule: "Host(`${TOOLS_DOMAIN_ASPIRE:-aspire.localhost}`)"
      traefik.http.routers.sankore-aspire-web.entrypoints: "web"
      traefik.http.routers.sankore-aspire-web.middlewares: "sankore-https-aspire"
      traefik.http.routers.sankore-aspire-web.service: "sankore-aspire"
      traefik.http.middlewares.sankore-https-aspire.redirectscheme.scheme: "https"
      traefik.http.middlewares.sankore-https-aspire.redirectscheme.permanent: "true"
    restart: "always"
  admin-postgres:
    image: ${DOCKER_REGISTRY-}admin-postgres
    # `container_name` retiré, volontairement.
    #
    # Un `container_name` est un nom GLOBAL sur le démon Docker, pas un nom cadré au projet
    # Compose. « postgres » et « admin-postgres » entrent donc en collision avec n'importe
    # quelle autre pile de la machine — constaté : un `postgres` d'un autre projet tournait
    # déjà et `up` échouait sur « The container name "/postgres" is already in use ».
    #
    # Sans cette clé, Compose nomme le conteneur « <projet>-<service>-1 ». Le nom DNS sur le
    # réseau reste le nom du SERVICE, donc les chaînes de connexion ci-dessous (Host=postgres)
    # continuent de résoudre.
    build:
      context: .
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Manquait, et la sonde de santé de `postgres.Dockerfile` la référence déjà
      # (`pg_isready -d "$POSTGRES_DB"`) — signe que l'image attendait cette variable.
      #
      # Sans elle, aucune base nommée n'est créée à l'initdb et c'est l'API qui crée la sienne
      # par ses migrations : Hangfire, qui pointe sur la MÊME base sans la créer, échouait sur
      # « database "Database" does not exist » dès qu'il démarrait le premier.
      #
      # Ne prend effet qu'au PREMIER démarrage d'un volume vide : sur un volume déjà initialisé,
      # c'est la dépendance vers l'API ci-dessous qui garantit l'ordre.
      POSTGRES_DB: "AdminDatabase"
    # Sonde de santé : `depends_on` était en `service_started`, qui n'attend que l'EXISTENCE du
    # conteneur. Or l'API applique ses migrations au démarrage (Program.cs), donc elle ouvrait
    # une connexion avant que Postgres n'accepte la moindre requête et mourait sur
    # « Connection refused » — constaté au premier `up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: "5s"
      timeout: "5s"
      retries: 12
      start_period: "10s"
    expose:
      - "5432"
    # Publié sur la BOUCLE LOCALE, pour qu'un client graphique (DataGrip, pgAdmin) puisse
    # passer par un tunnel SSH stable. Le port du conteneur n'était joignable que depuis
    # `sankore-internal`, ce qui n'offrait que `docker compose exec` — et un tunnel vers
    # l'IP du conteneur, qui change à chaque recréation.
    #
    # Lié comme les OUTILS, donc invisible depuis l'extérieur tant que `TOOLS_BIND_ADDRESS`
    # vaut `127.0.0.1`. Et surtout PAS de domaine Traefik ici : les labels de ce fichier
    # routent du HTTP, Postgres parle son propre protocole TCP. Une base de données joignable
    # publiquement n'est de toute façon pas ce qu'on veut.
    #
    # Bloc 18xxx comme le reste du fichier : 15432 est pris par d'autres piles Postgres de la
    # machine, ce qui est la raison pour laquelle les ports publiés vivent tous en 18xxx.
    ports:
      - "${TOOLS_BIND_ADDRESS}:${ADMIN_POSTGRES_PUBLISHED_PORT}:5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "sankorecrm.apphost-25fc6f3f86-admin-postgres-data"
        read_only: false
    networks:
      - "sankore-internal"
  sankore-admin:
    image: ${DOCKER_REGISTRY-}sankore.admin
    container_name: sankore.admin
    build:
      context: .
      dockerfile: src/Bootstrapper/Sankore.Admin/Dockerfile
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SANKORE_ADMIN_PORT}"
      ConnectionStrings__AdminDatabase: "Host=admin-postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=AdminDatabase"
      ADMINDATABASE_HOST: "admin-postgres"
      ADMINDATABASE_PORT: "5432"
      ADMINDATABASE_USERNAME: "postgres"
      ADMINDATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      ADMINDATABASE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@admin-postgres:5432/AdminDatabase"
      ADMINDATABASE_JDBCCONNECTIONSTRING: "jdbc:postgresql://admin-postgres:5432/AdminDatabase"
      ADMINDATABASE_DATABASENAME: "AdminDatabase"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "sankore-admin"
      ApiKey: "${SANKORE_API_KEY}"
    expose:
      - "${SANKORE_ADMIN_PORT}"
    # Lié sur `TOOLS_BIND_ADDRESS` et non sur toutes les interfaces : ce service est le
    # référentiel de tenants, il porte `TENANTSTORE_APIKEY`, et il n'a aucune raison d'être
    # joignable depuis l'extérieur. L'API l'atteint par le réseau Compose
    # (`TENANTSTORE_BASEURL=http://sankore-admin:8080/`), pas par ce port publié, qui ne
    # sert plus qu'à un tunnel SSH d'administration.
    ports:
      - "${TOOLS_BIND_ADDRESS}:${SANKORE_ADMIN_PUBLISHED_PORT}:${SANKORE_ADMIN_PORT}"
    depends_on:
      admin-postgres:
        condition: "service_healthy"
    # Aucun des trois hôtes n'avait de politique de redémarrage : une défaillance passagère au
    # démarrage — la base qui n'accepte pas encore, un courtier qui redémarre — laissait le
    # service à terre jusqu'à une intervention. `unless-stopped` et non `always` : un arrêt
    # demandé par un opérateur doit rester un arrêt.
    restart: "unless-stopped"
    networks:
      - "sankore-internal"
  postgres:
    image: ${DOCKER_REGISTRY-}postgres
    # Même raison que pour admin-postgres : un nom global qui collisionne.
    build:
      context: .
      dockerfile: postgres.Dockerfile
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      # Voir le commentaire sur admin-postgres.
      POSTGRES_DB: "Database"
    # Sonde de santé : `depends_on` était en `service_started`, qui n'attend que l'EXISTENCE du
    # conteneur. Or l'API applique ses migrations au démarrage (Program.cs), donc elle ouvrait
    # une connexion avant que Postgres n'accepte la moindre requête et mourait sur
    # « Connection refused » — constaté au premier `up`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: "5s"
      timeout: "5s"
      retries: 12
      start_period: "10s"
    expose:
      - "5432"
    # Publié sur la BOUCLE LOCALE, pour qu'un client graphique (DataGrip, pgAdmin) puisse
    # passer par un tunnel SSH stable. Le port du conteneur n'était joignable que depuis
    # `sankore-internal`, ce qui n'offrait que `docker compose exec` — et un tunnel vers
    # l'IP du conteneur, qui change à chaque recréation.
    #
    # Lié comme les OUTILS, donc invisible depuis l'extérieur tant que `TOOLS_BIND_ADDRESS`
    # vaut `127.0.0.1`. Et surtout PAS de domaine Traefik ici : les labels de ce fichier
    # routent du HTTP, Postgres parle son propre protocole TCP. Une base de données joignable
    # publiquement n'est de toute façon pas ce qu'on veut.
    #
    # Bloc 18xxx comme le reste du fichier : 15432 est pris par d'autres piles Postgres de la
    # machine, ce qui est la raison pour laquelle les ports publiés vivent tous en 18xxx.
    ports:
      - "${TOOLS_BIND_ADDRESS}:${POSTGRES_PUBLISHED_PORT}:5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "sankorecrm.apphost-25fc6f3f86-postgres-data"
        read_only: false
    networks:
      - "sankore-internal"
  rabbitmq:
    image: "docker.io/library/rabbitmq:4.3-management"
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: "10s"
      timeout: "10s"
      retries: 10
      start_period: "20s"
    expose:
      - "5672"
      - "15672"
    ports:
      - "${TOOLS_BIND_ADDRESS}:${RABBITMQ_MANAGEMENT_PUBLISHED_PORT}:15672"
    networks:
      - "sankore-internal"
      - "dokploy-network"
    # ── Exposition publique par Traefik (Dokploy) ──────────────────────────
    # Seule l'interface de gestion (15672) est routée. 5672, le port AMQP, reste interne :
    # un routeur HTTP ne saurait pas le servir et il n'a rien à faire dehors.
    labels:
      traefik.enable: "true"
      # Le conteneur est sur DEUX réseaux depuis l'ajout ci-dessus. Sans cette ligne Traefik
      # choisit lui-même l'IP vers laquelle router, et il peut choisir celle de
      # `sankore-internal`, où il n'est pas rattaché : le domaine répond alors par
      # intermittence, ou pas du tout.
      traefik.docker.network: "dokploy-network"

      # Routeur HTTPS. `tls.certresolver=letsencrypt` est le résolveur que Dokploy déclare
      # dans son Traefik ; le certificat est demandé au premier appel du domaine, donc
      # l'enregistrement DNS doit déjà pointer sur l'hôte Dokploy AVANT le déploiement.
      traefik.http.routers.sankore-rabbitmq.rule: "Host(`${TOOLS_DOMAIN_RABBITMQ:-mq.localhost}`)"
      traefik.http.routers.sankore-rabbitmq.entrypoints: "websecure"
      traefik.http.routers.sankore-rabbitmq.tls.certresolver: "letsencrypt"
      traefik.http.routers.sankore-rabbitmq.middlewares: "sankore-auth-rabbitmq"
      # `service` explicite : plusieurs ports sont déclarés sur ce conteneur et Traefik
      # refuse de deviner lequel servir.
      traefik.http.routers.sankore-rabbitmq.service: "sankore-rabbitmq"
      traefik.http.services.sankore-rabbitmq.loadbalancer.server.port: "15672"

      # Authentification HTTP posée DEVANT l'application. Le middleware est défini ici, sur
      # le service qu'il protège, et non une fois pour toutes ailleurs : un middleware
      # déclaré sur un autre conteneur disparaît quand ce conteneur s'arrête, et tous les
      # routeurs qui le référencent tombent avec lui.
      #
      # `TOOLS_BASICAUTH_USERS` vide = middleware invalide = routeur refusé par Traefik. Le
      # domaine ne répond pas tant que les identifiants ne sont pas posés, ce qui est le bon
      # sens de l'échec : jamais d'ouverture par oubli.
      traefik.http.middlewares.sankore-auth-rabbitmq.basicauth.users: "${TOOLS_BASICAUTH_USERS}"
      # L'en-tête `Authorization` n'est pas transmis en amont : l'application derrière n'a
      # rien à faire de ces identifiants-là, et Grafana comme Hangfire ont les leurs.
      traefik.http.middlewares.sankore-auth-rabbitmq.basicauth.removeheader: "true"

      # Routeur HTTP, uniquement pour renvoyer sur HTTPS. La redirection est définie ici
      # plutôt qu'emprunté au `redirect-to-https` de Dokploy : celui-là vit dans le
      # fournisseur `file` de Traefik et devrait être référencé `redirect-to-https@file`,
      # un détail qui casse en silence si Dokploy le renomme.
      traefik.http.routers.sankore-rabbitmq-web.rule: "Host(`${TOOLS_DOMAIN_RABBITMQ:-mq.localhost}`)"
      traefik.http.routers.sankore-rabbitmq-web.entrypoints: "web"
      traefik.http.routers.sankore-rabbitmq-web.middlewares: "sankore-https-rabbitmq"
      traefik.http.routers.sankore-rabbitmq-web.service: "sankore-rabbitmq"
      traefik.http.middlewares.sankore-https-rabbitmq.redirectscheme.scheme: "https"
      traefik.http.middlewares.sankore-https-rabbitmq.redirectscheme.permanent: "true"
  seq:
    image: "docker.io/datalust/seq:2025.2"
    environment:
      ACCEPT_EULA: "Y"
      # Seq contient les journaux de l'application : identifiants de tenant, d'utilisateur,
      # d'appel, et le détail des erreurs. Sans authentification c'est lisible — et
      # interrogeable par son API — par quiconque atteint le port.
      #
      # Laissé ouvert pour une pile LOCALE, et uniquement parce que le port est maintenant lié
      # à la boucle locale. Pour un déploiement partagé : poser
      # SEQ_FIRSTRUN_ADMINPASSWORDHASH (`seqcli hash`) et mettre SEQ_NO_AUTHENTICATION=False.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "${SEQ_NO_AUTHENTICATION}"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: "${SEQ_ADMIN_PASSWORD_HASH}"
    expose:
      - "80"
    ports:
      - "${TOOLS_BIND_ADDRESS}:${SEQ_PUBLISHED_PORT}:80"
    networks:
      - "sankore-internal"
      - "dokploy-network"
    # ── Exposition publique par Traefik (Dokploy) ──────────────────────────
    # Seq écoute sur 80. Poser SEQ_NO_AUTHENTICATION=False et SEQ_ADMIN_PASSWORD_HASH
    # maintenant que l'interface est publique : l'authentification Traefik protège
    # l'accès, pas l'API Seq appelée avec une clé.
    labels:
      traefik.enable: "true"
      # Le conteneur est sur DEUX réseaux depuis l'ajout ci-dessus. Sans cette ligne Traefik
      # choisit lui-même l'IP vers laquelle router, et il peut choisir celle de
      # `sankore-internal`, où il n'est pas rattaché : le domaine répond alors par
      # intermittence, ou pas du tout.
      traefik.docker.network: "dokploy-network"

      # Routeur HTTPS. `tls.certresolver=letsencrypt` est le résolveur que Dokploy déclare
      # dans son Traefik ; le certificat est demandé au premier appel du domaine, donc
      # l'enregistrement DNS doit déjà pointer sur l'hôte Dokploy AVANT le déploiement.
      traefik.http.routers.sankore-seq.rule: "Host(`${TOOLS_DOMAIN_SEQ:-seq.localhost}`)"
      traefik.http.routers.sankore-seq.entrypoints: "websecure"
      traefik.http.routers.sankore-seq.tls.certresolver: "letsencrypt"
      traefik.http.routers.sankore-seq.middlewares: "sankore-auth-seq"
      # `service` explicite : plusieurs ports sont déclarés sur ce conteneur et Traefik
      # refuse de deviner lequel servir.
      traefik.http.routers.sankore-seq.service: "sankore-seq"
      traefik.http.services.sankore-seq.loadbalancer.server.port: "80"

      # Authentification HTTP posée DEVANT l'application. Le middleware est défini ici, sur
      # le service qu'il protège, et non une fois pour toutes ailleurs : un middleware
      # déclaré sur un autre conteneur disparaît quand ce conteneur s'arrête, et tous les
      # routeurs qui le référencent tombent avec lui.
      #
      # `TOOLS_BASICAUTH_USERS` vide = middleware invalide = routeur refusé par Traefik. Le
      # domaine ne répond pas tant que les identifiants ne sont pas posés, ce qui est le bon
      # sens de l'échec : jamais d'ouverture par oubli.
      traefik.http.middlewares.sankore-auth-seq.basicauth.users: "${TOOLS_BASICAUTH_USERS}"
      # L'en-tête `Authorization` n'est pas transmis en amont : l'application derrière n'a
      # rien à faire de ces identifiants-là, et Grafana comme Hangfire ont les leurs.
      traefik.http.middlewares.sankore-auth-seq.basicauth.removeheader: "true"

      # Routeur HTTP, uniquement pour renvoyer sur HTTPS. La redirection est définie ici
      # plutôt qu'emprunté au `redirect-to-https` de Dokploy : celui-là vit dans le
      # fournisseur `file` de Traefik et devrait être référencé `redirect-to-https@file`,
      # un détail qui casse en silence si Dokploy le renomme.
      traefik.http.routers.sankore-seq-web.rule: "Host(`${TOOLS_DOMAIN_SEQ:-seq.localhost}`)"
      traefik.http.routers.sankore-seq-web.entrypoints: "web"
      traefik.http.routers.sankore-seq-web.middlewares: "sankore-https-seq"
      traefik.http.routers.sankore-seq-web.service: "sankore-seq"
      traefik.http.middlewares.sankore-https-seq.redirectscheme.scheme: "https"
      traefik.http.middlewares.sankore-https-seq.redirectscheme.permanent: "true"
  maildev:
    image: "maildev/maildev:latest"
    expose:
      - "1025"
      - "1080"
    # Celui-ci est le plus sensible des quatre, et la revue automatique ne l'a pas relevé :
    # maildev capture les courriels sortants, donc les jetons d'ACTIVATION et de
    # RÉINITIALISATION DE MOT DE PASSE. Une interface ouverte sur le réseau, c'est une prise
    # de contrôle de compte en deux clics.
    ports:
      - "${TOOLS_BIND_ADDRESS}:${MAILDEV_PUBLISHED_PORT}:1080"
    networks:
      - "sankore-internal"
  redis:
    image: "docker.io/library/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: "5s"
      timeout: "5s"
      retries: 12
    expose:
      - "6379"
    networks:
      - "sankore-internal"
  tempo:
    image: "grafana/tempo:2.5.0"
    container_name: "sankore-tempo"
    command:
      - "-config.file=/etc/tempo.yaml"
    expose:
      - "3200"
      - "4317"
    volumes:
      - type: "bind"
        target: "/etc/tempo.yaml"
        source: "${TEMPO_BINDMOUNT_0}"
        read_only: true
    networks:
      - "sankore-internal"
  prometheus:
    image: "prom/prometheus:v2.52.0"
    container_name: "sankore-prometheus"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    volumes:
      - type: "bind"
        target: "/etc/prometheus/prometheus.yml"
        source: "${PROMETHEUS_BINDMOUNT_0}"
        read_only: true
    networks:
      - "sankore-internal"
  grafana:
    image: "grafana/grafana:11.1.0"
    container_name: "sankore-grafana"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      # `Admin` anonyme était un chemin d'ESCALADE et pas seulement une commodité : un
      # administrateur Grafana peut créer une source de données, c'est-à-dire faire émettre des
      # requêtes par le conteneur vers le réseau interne — Postgres, l'API, Redis. `Viewer` ne
      # peut pas en créer, et les tableaux de bord restent lisibles d'un clic.
      #
      # Mettre GRAFANA_ANONYMOUS_ENABLED=false pour exiger une connexion
      # (GRAFANA_ADMIN_PASSWORD).
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_ANONYMOUS_ENABLED}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    expose:
      - "3000"
    ports:
      - "${TOOLS_BIND_ADDRESS}:${GRAFANA_PUBLISHED_PORT}:3000"
    volumes:
      - type: "bind"
        target: "/etc/grafana/provisioning"
        source: "${GRAFANA_BINDMOUNT_0}"
        read_only: true
      - type: "bind"
        target: "/var/lib/grafana/dashboards"
        source: "${GRAFANA_BINDMOUNT_1}"
        read_only: true
    depends_on:
      prometheus:
        condition: "service_started"
      tempo:
        condition: "service_started"
    networks:
      - "sankore-internal"
      - "dokploy-network"
    # ── Exposition publique par Traefik (Dokploy) ──────────────────────────
    # Grafana sert son interface sur 3000 dans le conteneur ; `GRAFANA_PUBLISHED_PORT`
    # (18030) est le port de l'HÔTE et ne veut rien dire pour Traefik.
    labels:
      traefik.enable: "true"
      # Le conteneur est sur DEUX réseaux depuis l'ajout ci-dessus. Sans cette ligne Traefik
      # choisit lui-même l'IP vers laquelle router, et il peut choisir celle de
      # `sankore-internal`, où il n'est pas rattaché : le domaine répond alors par
      # intermittence, ou pas du tout.
      traefik.docker.network: "dokploy-network"

      # Routeur HTTPS. `tls.certresolver=letsencrypt` est le résolveur que Dokploy déclare
      # dans son Traefik ; le certificat est demandé au premier appel du domaine, donc
      # l'enregistrement DNS doit déjà pointer sur l'hôte Dokploy AVANT le déploiement.
      traefik.http.routers.sankore-grafana.rule: "Host(`${TOOLS_DOMAIN_GRAFANA:-grafana.localhost}`)"
      traefik.http.routers.sankore-grafana.entrypoints: "websecure"
      traefik.http.routers.sankore-grafana.tls.certresolver: "letsencrypt"
      traefik.http.routers.sankore-grafana.middlewares: "sankore-auth-grafana"
      # `service` explicite : plusieurs ports sont déclarés sur ce conteneur et Traefik
      # refuse de deviner lequel servir.
      traefik.http.routers.sankore-grafana.service: "sankore-grafana"
      traefik.http.services.sankore-grafana.loadbalancer.server.port: "3000"

      # Authentification HTTP posée DEVANT l'application. Le middleware est défini ici, sur
      # le service qu'il protège, et non une fois pour toutes ailleurs : un middleware
      # déclaré sur un autre conteneur disparaît quand ce conteneur s'arrête, et tous les
      # routeurs qui le référencent tombent avec lui.
      #
      # `TOOLS_BASICAUTH_USERS` vide = middleware invalide = routeur refusé par Traefik. Le
      # domaine ne répond pas tant que les identifiants ne sont pas posés, ce qui est le bon
      # sens de l'échec : jamais d'ouverture par oubli.
      traefik.http.middlewares.sankore-auth-grafana.basicauth.users: "${TOOLS_BASICAUTH_USERS}"
      # L'en-tête `Authorization` n'est pas transmis en amont : l'application derrière n'a
      # rien à faire de ces identifiants-là, et Grafana comme Hangfire ont les leurs.
      traefik.http.middlewares.sankore-auth-grafana.basicauth.removeheader: "true"

      # Routeur HTTP, uniquement pour renvoyer sur HTTPS. La redirection est définie ici
      # plutôt qu'emprunté au `redirect-to-https` de Dokploy : celui-là vit dans le
      # fournisseur `file` de Traefik et devrait être référencé `redirect-to-https@file`,
      # un détail qui casse en silence si Dokploy le renomme.
      traefik.http.routers.sankore-grafana-web.rule: "Host(`${TOOLS_DOMAIN_GRAFANA:-grafana.localhost}`)"
      traefik.http.routers.sankore-grafana-web.entrypoints: "web"
      traefik.http.routers.sankore-grafana-web.middlewares: "sankore-https-grafana"
      traefik.http.routers.sankore-grafana-web.service: "sankore-grafana"
      traefik.http.middlewares.sankore-https-grafana.redirectscheme.scheme: "https"
      traefik.http.middlewares.sankore-https-grafana.redirectscheme.permanent: "true"
  sankore-api:
    image: ${DOCKER_REGISTRY-}sankore.api
    container_name: sankore.api
    build:
      context: .
      dockerfile: src/Bootstrapper/Sankore.Api/Dockerfile
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SANKORE_API_PORT}"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=Database"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/Database"
      DATABASE_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/Database"
      DATABASE_DATABASENAME: "Database"
      ConnectionStrings__rabbitmq: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "guest"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_URI: "amqp://guest:${RABBITMQ_PASSWORD}@rabbitmq:5672"
      ConnectionStrings__seq: "http://seq:80"
      SEQ_HOST: "seq"
      SEQ_PORT: "80"
      SEQ_URI: "http://seq:80"
      ConnectionStrings__redis: "redis:6379,password=${REDIS_PASSWORD}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      REDIS_URI: "redis://:${REDIS_PASSWORD}@redis:6379"
      SANKORE_TEMPO_OTLP_ENDPOINT: "http://tempo:4317"
      Notifications__Smtp__Host: "maildev"
      Notifications__Smtp__Port: "1025"
      Notifications__Smtp__UseSsl: "false"
      Notifications__Smtp__UseStartTls: "false"
      # ── Jetons d'authentification ──────────────────────────────────────
      Jwt__SigningKey: "${JWT_SIGNING_KEY}"
      Jwt__Issuer: "${JWT_ISSUER}"
      Jwt__Audience: "${JWT_AUDIENCE}"

      # ── Coffre de secrets ──────────────────────────────────────────────
      # L'API REFUSE DE DÉMARRER sans une valeur valide.
      Secrets__EncryptionKey: "${SECRETS_ENCRYPTION_KEY}"

      # ── Chiffrement de champs et index aveugles, par module ────────────
      # Validés à la PREMIÈRE UTILISATION, pas au démarrage : une clé absente se manifeste
      # par une écriture en échec et non par un démarrage en échec.
      Customers__FieldEncryptionKey: "${CUSTOMERS_FIELD_ENCRYPTION_KEY}"
      Customers__BlindIndexKey: "${CUSTOMERS_BLIND_INDEX_KEY}"
      Leads__FieldEncryptionKey: "${LEADS_FIELD_ENCRYPTION_KEY}"
      Leads__BlindIndexKey: "${LEADS_BLIND_INDEX_KEY}"
      Kyc__FieldEncryptionKey: "${KYC_FIELD_ENCRYPTION_KEY}"
      Kyc__BlindIndexKey: "${KYC_BLIND_INDEX_KEY}"
      Integration__FieldEncryptionKey: "${INTEGRATION_FIELD_ENCRYPTION_KEY}"
      Integration__BlindIndexKey: "${INTEGRATION_BLIND_INDEX_KEY}"

      # ── Magasins d'objets chiffrés ─────────────────────────────────────
      # Cinq préoccupations, cinq clés. Les BasePath pointent sur des VOLUMES : par défaut
      # ils atterrissent sous la racine de contenu, qu'un redéploiement détruit — les images
      # KYC et les enregistrements d'appels seraient perdus à chaque mise à jour.
      Kyc__Storage__EncryptionKey: "${KYC_STORAGE_ENCRYPTION_KEY}"
      Kyc__Storage__BasePath: "/var/sankore/kyc"
      FileStore__EncryptionKey: "${FILESTORE_ENCRYPTION_KEY}"
      FileStore__BasePath: "/var/sankore/files"
      Integration__Batch__Storage__EncryptionKey: "${INTEGRATION_BATCH_STORAGE_ENCRYPTION_KEY}"
      Integration__Batch__Storage__BasePath: "/var/sankore/batch"
      Integration__Insurance__ClaimStorage__EncryptionKey: "${INTEGRATION_CLAIMSTORAGE_ENCRYPTION_KEY}"
      Integration__Insurance__ClaimStorage__BasePath: "/var/sankore/claims"

      # Enregistrements d'appels : le magasin n'est enregistré QUE si la clé est présente, et
      # la politique est livrée `Disabled`. Vide = pas d'enregistrement, ce qui est le défaut.
      Telephony__Recordings__EncryptionKey: "${TELEPHONY_RECORDINGS_ENCRYPTION_KEY}"
      Telephony__Recordings__BasePath: "/var/sankore/recordings"

      # ── Stockage objet Cloudflare R2 ───────────────────────────────────
      # Choisit le support des cinq magasins ci-dessus : un bucket R2 par préoccupation si
      # ceci est renseigné, les volumes locaux sinon. Le chiffrement reste le même dans les
      # deux cas — ces clés-ci ne remplacent aucune des clés de chiffrement ci-dessus.
      #
      # LES TROIS ENSEMBLE OU AUCUNE. `IsConfigured` est un OU sur les quatre valeurs :
      # une seule renseignée fait ÉCHOUER LE DÉMARRAGE en nommant la clé manquante, au lieu
      # de retomber silencieusement sur un volume qu'un redéploiement jette. Vides, les trois
      # sont lues comme absentes (`Trimmed`) et on garde le comportement actuel.
      #
      # Les buckets ne sont PAS créés par l'API : les cinq doivent exister chez R2, nommés
      # exactement comme la préoccupation — kyc-documents, imports, integration-batch-files,
      # insurance-claim-documents, telephony-recordings.
      ObjectStorage__R2__AccountId: "${R2_ACCOUNT_ID}"
      ObjectStorage__R2__AccessKeyId: "${R2_ACCESS_KEY_ID}"
      ObjectStorage__R2__SecretAccessKey: "${R2_SECRET_ACCESS_KEY}"
      # Point de terminaison complet. VIDE en R2 normal : il est dérivé de l'AccountId en
      # `https://<AccountId>.r2.cloudflarestorage.com`. À ne renseigner que pour un service
      # compatible S3 qui n'est pas R2 (MinIO) ou un point de terminaison R2 régional.
      ObjectStorage__R2__ServiceUrl: "${R2_SERVICE_URL}"

      # ── Référentiel de tenants ─────────────────────────────────────────
      TenantStore__BaseUrl: "${TENANTSTORE_BASEURL}"
      TenantStore__ApiKey: "${TENANTSTORE_APIKEY}"
      

      # ── CORS ───────────────────────────────────────────────────────────
      # Un tableau : une variable par indice. « * » est refusé au démarrage, la politique
      # autorisant les identifiants.
      Cors__AllowedOrigins__0: "${CORS_ALLOWED_ORIGIN_0}"
      Cors__AllowedOrigins__1: "${CORS_ALLOWED_ORIGIN_1}"

      # ── Swagger ────────────────────────────────────────────────────────
      # Servi uniquement derrière une authentification Basic hors développement, et répond
      # 503 tant que le mot de passe n'est pas posé.
      Swagger__Enabled: "${SWAGGER_ENABLED}"
      Swagger__Auth__Username: "${SWAGGER_AUTH_USERNAME}"
      Swagger__Auth__Password: "${SWAGGER_AUTH_PASSWORD}"

      # ── Antivirus des pièces de sinistre ───────────────────────────────
      # Défaut FERMÉ : sans analyseur, chaque pièce est `ScanFailed` et rien ne part chez un
      # assureur.
      Integration__Insurance__Antivirus__Address: "${INTEGRATION_ANTIVIRUS_ADDRESS}"

      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "sankore-api"
    # Sonde HTTP sans paquet ajouté : l'image `aspnet` n'embarque ni curl, ni wget, ni nc —
    # seulement bash, dont `/dev/tcp` suffit.
    #
    # Forme `CMD` avec bash EXPLICITE, et non `CMD-SHELL` : celui-ci passe par `/bin/sh`
    # (dash), qui ne connaît pas `/dev/tcp` et répond « cannot create /dev/tcp/...: Directory
    # nonexistent ». La sonde échouait alors toujours, l'API restait `unhealthy`, et Hangfire
    # ne démarrait jamais puisqu'il l'attend.
    #
    # Elle tape `/health`, et comme les migrations tournent AVANT que Kestrel n'écoute, une
    # réponse prouve que la base est prête — ce qui est précisément ce que Hangfire attend.
    healthcheck:
      test:
        - "CMD"
        - "bash"
        - "-c"
        - "exec 3<>/dev/tcp/127.0.0.1/${SANKORE_API_PORT} && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200"
      interval: "10s"
      timeout: "5s"
      retries: 12
      start_period: "40s"
    expose:
      - "${SANKORE_API_PORT}"
    # Publié sur l'hôte : le fichier généré ne déclarait qu'`expose`, donc l'API n'était
    # joignable que depuis le réseau Compose — et `sankore-internal` est `internal`.
    ports:
      - "${SANKORE_API_PUBLISHED_PORT}:${SANKORE_API_PORT}"
    volumes:
      # Un volume par préoccupation chiffrée. Sans eux, les BasePath ci-dessus atterrissent
      # dans la couche du conteneur, qu'un redéploiement détruit.
      - type: "volume"
        source: "sankore-kyc-storage"
        target: "/var/sankore/kyc"
      - type: "volume"
        source: "sankore-filestore"
        target: "/var/sankore/files"
      - type: "volume"
        source: "sankore-batch-storage"
        target: "/var/sankore/batch"
      - type: "volume"
        source: "sankore-claim-storage"
        target: "/var/sankore/claims"
      - type: "volume"
        source: "sankore-recordings"
        target: "/var/sankore/recordings"
    depends_on:
      rabbitmq:
        condition: "service_healthy"
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
      # `seq` manquait alors que l'API porte `ConnectionStrings__seq`. Laissé en
      # `service_started` : les journaux partent en tâche de fond et une collecte indisponible
      # ne doit pas retarder le démarrage de l'API.
      seq:
        condition: "service_started"
    # Aucun des trois hôtes n'avait de politique de redémarrage : une défaillance passagère au
    # démarrage — la base qui n'accepte pas encore, un courtier qui redémarre — laissait le
    # service à terre jusqu'à une intervention. `unless-stopped` et non `always` : un arrêt
    # demandé par un opérateur doit rester un arrêt.
    restart: "unless-stopped"
    # `dokploy-network` en plus de `sankore-internal` : Traefik tourne dans son propre
    # conteneur et ne peut router que vers un réseau auquel il est rattaché. C'est le SEUL
    # service public — le domaine Dokploy doit viser le port du CONTENEUR
    # (`SANKORE_API_PORT`, exposé), pas le port publié sur l'hôte.
    networks:
      - "sankore-internal"
      - "dokploy-network"
  sankore-hangfire:
    image: ${DOCKER_REGISTRY-}sankore.hangfire
    container_name: sankore.hangfire
    build:
      context: .
      dockerfile: src/Bootstrapper/Sankore.Hangfire/Dockerfile
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${SANKORE_HANGFIRE_PORT}"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=Database"
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: "postgres"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD}"
      DATABASE_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/Database"
      DATABASE_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/Database"
      DATABASE_DATABASENAME: "Database"
      # Étaient codés en dur dans le fichier généré. Le tableau de bord pointe sur la MÊME
      # base que l'API et refuse toute requête sans mot de passe.
      Hangfire__Dashboard__Username: "${HANGFIRE_DASHBOARD_USERNAME}"
      Hangfire__Dashboard__Password: "${HANGFIRE_DASHBOARD_PASSWORD}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "sankore-hangfire"
    expose:
      - "${SANKORE_HANGFIRE_PORT}"
    ports:
      # Lié comme les OUTILS et non comme les hôtes applicatifs : ce n'est pas une surface
      # produit, c'est un tableau de bord qui déclenche, requeue et supprime des travaux de
      # fond. Avec un mot de passe de développement, l'ouvrir au réseau donne la main sur les
      # traitements par lots de l'institution.
      - "${TOOLS_BIND_ADDRESS}:${SANKORE_HANGFIRE_PUBLISHED_PORT}:${SANKORE_HANGFIRE_PORT}"
    depends_on:
      postgres:
        condition: "service_healthy"
      # Hangfire pointe sur la MÊME base que l'API mais ne la crée pas : c'est l'API qui
      # l'applique par ses migrations. Sans cette dépendance, Hangfire démarrant le premier
      # mourait sur « database "Database" does not exist » — constaté.
      sankore-api:
        condition: "service_healthy"
    # Aucun des trois hôtes n'avait de politique de redémarrage : une défaillance passagère au
    # démarrage — la base qui n'accepte pas encore, un courtier qui redémarre — laissait le
    # service à terre jusqu'à une intervention. `unless-stopped` et non `always` : un arrêt
    # demandé par un opérateur doit rester un arrêt.
    restart: "unless-stopped"
    networks:
      - "sankore-internal"
      - "dokploy-network"
    # ── Exposition publique par Traefik (Dokploy) ──────────────────────────
    # Double authentification assumée : celle de Traefik ci-dessous ET celle du tableau de
    # bord (`Hangfire__Dashboard__*`). Ce tableau de bord relance et supprime des
    # travaux de fond — le runbook §5 demande de le restreindre.
    labels:
      traefik.enable: "true"
      # Le conteneur est sur DEUX réseaux depuis l'ajout ci-dessus. Sans cette ligne Traefik
      # choisit lui-même l'IP vers laquelle router, et il peut choisir celle de
      # `sankore-internal`, où il n'est pas rattaché : le domaine répond alors par
      # intermittence, ou pas du tout.
      traefik.docker.network: "dokploy-network"

      # Routeur HTTPS. `tls.certresolver=letsencrypt` est le résolveur que Dokploy déclare
      # dans son Traefik ; le certificat est demandé au premier appel du domaine, donc
      # l'enregistrement DNS doit déjà pointer sur l'hôte Dokploy AVANT le déploiement.
      traefik.http.routers.sankore-hangfire.rule: "Host(`${TOOLS_DOMAIN_HANGFIRE:-jobs.localhost}`)"
      traefik.http.routers.sankore-hangfire.entrypoints: "websecure"
      traefik.http.routers.sankore-hangfire.tls.certresolver: "letsencrypt"
      traefik.http.routers.sankore-hangfire.middlewares: "sankore-auth-hangfire"
      # `service` explicite : plusieurs ports sont déclarés sur ce conteneur et Traefik
      # refuse de deviner lequel servir.
      traefik.http.routers.sankore-hangfire.service: "sankore-hangfire"
      traefik.http.services.sankore-hangfire.loadbalancer.server.port: "${SANKORE_HANGFIRE_PORT}"

      # Authentification HTTP posée DEVANT l'application. Le middleware est défini ici, sur
      # le service qu'il protège, et non une fois pour toutes ailleurs : un middleware
      # déclaré sur un autre conteneur disparaît quand ce conteneur s'arrête, et tous les
      # routeurs qui le référencent tombent avec lui.
      #
      # `TOOLS_BASICAUTH_USERS` vide = middleware invalide = routeur refusé par Traefik. Le
      # domaine ne répond pas tant que les identifiants ne sont pas posés, ce qui est le bon
      # sens de l'échec : jamais d'ouverture par oubli.
      traefik.http.middlewares.sankore-auth-hangfire.basicauth.users: "${TOOLS_BASICAUTH_USERS}"
      # L'en-tête `Authorization` n'est pas transmis en amont : l'application derrière n'a
      # rien à faire de ces identifiants-là, et Grafana comme Hangfire ont les leurs.
      traefik.http.middlewares.sankore-auth-hangfire.basicauth.removeheader: "true"

      # Routeur HTTP, uniquement pour renvoyer sur HTTPS. La redirection est définie ici
      # plutôt qu'emprunté au `redirect-to-https` de Dokploy : celui-là vit dans le
      # fournisseur `file` de Traefik et devrait être référencé `redirect-to-https@file`,
      # un détail qui casse en silence si Dokploy le renomme.
      traefik.http.routers.sankore-hangfire-web.rule: "Host(`${TOOLS_DOMAIN_HANGFIRE:-jobs.localhost}`)"
      traefik.http.routers.sankore-hangfire-web.entrypoints: "web"
      traefik.http.routers.sankore-hangfire-web.middlewares: "sankore-https-hangfire"
      traefik.http.routers.sankore-hangfire-web.service: "sankore-hangfire"
      traefik.http.middlewares.sankore-https-hangfire.redirectscheme.scheme: "https"
      traefik.http.middlewares.sankore-https-hangfire.redirectscheme.permanent: "true"
networks:
  # `local: true` retiré : ce n'est pas une clé reconnue par Compose, et le fichier était
  # refusé à la validation (« additional properties 'local' not allowed »).
  #
  # Remplacé par le pilote par défaut et NON par `internal: true`, bien que le nom y invite :
  # `internal` coupe tout accès sortant du réseau, ce qui empêcherait l'API de joindre un
  # serveur SMTP, une passerelle SMS ou un fournisseur de téléphonie. Rien dans le fichier
  # généré ne demandait cette isolation — l'ajouter aurait été un changement de comportement
  # déduit d'un nom.
  sankore-internal:
    driver: "bridge"

  # Créé et possédé par Dokploy, d'où `external` : Compose s'y rattache sans le gérer. Un
  # `docker compose up` sur une machine sans Dokploy échoue ici tant que le réseau n'existe
  # pas — `docker network create dokploy-network` suffit à le satisfaire localement.
  dokploy-network:
    external: true

  # Déclaré parce que `env-dashboard` s'y rattache. Il manquait, et Compose refuse un service
  # qui référence un réseau inexistant.
  aspire:
    driver: "bridge"
volumes:
  sankorecrm.apphost-25fc6f3f86-admin-postgres-data:
    driver: "local"
  sankorecrm.apphost-25fc6f3f86-postgres-data:
    driver: "local"

  # Un volume par préoccupation chiffrée de l'API. Séparés et non un seul : ce sont cinq clés
  # distinctes, et les monter ensemble ferait d'une sauvegarde partielle une sauvegarde dont
  # on ne sait pas ce qu'elle contient.
  sankore-kyc-storage:
    driver: "local"
  sankore-filestore:
    driver: "local"
  sankore-batch-storage:
    driver: "local"
  sankore-claim-storage:
    driver: "local"
  sankore-recordings:
    driver: "local"
